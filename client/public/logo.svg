<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Professional V monogram logo</title>

  <!-- Background badge, flat single color -->
  <rect x="0" y="0" width="240" height="240" rx="40" fill="#050b16"/>

  <!-- Clean geometric V letterform, uniform stroke, sharp precise angles -->
  <path d="M76 72 L120 158 L164 72 L146 72 L120 124 L94 72 Z" fill="#ffffff"/>

  <!-- Thin baseline rule beneath, a common professional wordmark device -->
  <rect x="94" y="176" width="52" height="4" rx="2" fill="#3b82f6"/>
</svg>
